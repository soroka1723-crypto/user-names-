name: Run Rust Telegram bot
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Moscow time (UTC+3): 10:00-15:00 and 15:20-20:20.
    - cron: '0 7 * * *'
    - cron: '20 12 * * *'
  workflow_dispatch:
concurrency:
  group: username-generator-${{ github.event_name == 'push' && 'checks' || 'runtime' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/cache@v4
        with:
          path: |
            username_data.db
            username_data.db-wal
          key: username-db-${{ github.run_id }}
          restore-keys: |
            username-db-
      - name: Build
        run: cargo build --release
      - name: Run Rust tests
        run: cargo test --release
      - name: Run bot for one session
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set +e
          export TZ=Europe/Moscow
          now=$(date +%s)
          today=$(date +%F)
          if [[ "$(date +%H%M)" -ge 1000 && "$(date +%H%M)" -lt 1500 ]]; then
            end=$(date -d "$today 15:00:00" +%s)
          elif [[ "$(date +%H%M)" -ge 1520 && "$(date +%H%M)" -lt 2020 ]]; then
            end=$(date -d "$today 20:20:00" +%s)
          else
            echo "Outside scheduled Moscow-time windows; bot will not start."
            exit 0
          fi
          remaining=$((end - now))
          if [[ "$remaining" -le 0 ]]; then
            echo "Session end time has passed; bot will not start."
            exit 0
          fi
          echo "Starting bot until $(date -d "@$end" '+%H:%M:%S %Z') Moscow time."
          timeout --signal=INT --kill-after=15s "${remaining}s" ./target/release/username_generator_bot
          status=$?
          if [[ "$status" -eq 124 || "$status" -eq 130 ]]; then
            echo "Scheduled Moscow-time session finished normally."
            exit 0
          fi
          exit "$status"